projeto: quadro-equipe

# Stack da aplicação monitorada (não confundir com a stack interna do SDDTrack).
# Preencha com as tecnologias reais do projeto; a seção fica vazia no exemplo.
# stack:
#   backend: "Java + Spring Boot"
#   frontend: "HTML, CSS e JavaScript"
#   banco_de_dados: "PostgreSQL"

ignorar: ["*.md", "tests/**"]

requisitos:
  - {id: REQ-001, titulo: Usuário autentica no sistema}
  - {id: REQ-002, titulo: Equipe gerencia cartões no quadro}

casos_de_uso:
  - {id: UC-001, titulo: Cadastro e login, requisitos: [REQ-001]}
  - {id: UC-002, titulo: Gerenciar cartões, requisitos: [REQ-002]}

uml:
  - {id: UML-User, tipo: classe, elemento: User, tasks: [TASK-001, TASK-002]}
  - {id: UML-Card, tipo: classe, elemento: Card, tasks: [TASK-003]}

tasks:
  - id: TASK-001
    titulo: Modelo de usuário
    caso_de_uso: UC-001
    criterios:
      - {id: C1, descricao: Existe a classe User, artefato: {tipo: classe, padrao: User}}
  - id: TASK-002
    titulo: Login com e-mail e senha
    caso_de_uso: UC-001
    depende_de: [TASK-001]
    criterios:
      - {id: C1, descricao: Existe rota POST /login, artefato: {tipo: rota, padrao: "POST /login"}}
      - {id: C2, descricao: Senha comparada usando hash, artefato: {tipo: funcao, padrao: "*hash*senha*"}}
  - id: TASK-003
    titulo: Criar cartão no quadro
    caso_de_uso: UC-002
    depende_de: [TASK-002]
    criterios:
      - {id: C1, descricao: Existe rota POST /cards, artefato: {tipo: rota, padrao: "POST /cards"}}
      - {id: C2, descricao: Cartão exige título não vazio ao ser criado}
