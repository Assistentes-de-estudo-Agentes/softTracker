projeto:
  nome: "Gerenciador simples de tarefas"
  descricao: >
    API REST básica para cadastrar e consultar tarefas pessoais.
  objetivo: "Demonstrar como requisitos e casos de uso podem orientar o desenvolvimento."
  stack:
    linguagem: Java
    versao_java: "17"
    framework: Spring Boot
    build: Maven
    armazenamento: "Memória (os dados são perdidos ao reiniciar a aplicação)"

requisitos_funcionais:
  - id: RF001
    descricao: "O sistema deve permitir cadastrar uma tarefa com título e descrição."
    status: implementado
  - id: RF002
    descricao: "O sistema deve permitir listar todas as tarefas cadastradas."
    status: implementado
  - id: RF003
    descricao: "O sistema deve permitir consultar uma tarefa pelo identificador."
    status: nao_implementado
  - id: RF004
    descricao: "O sistema deve permitir alterar o título, a descrição e o estado de conclusão."
    status: nao_implementado
  - id: RF005
    descricao: "O sistema deve permitir excluir uma tarefa pelo identificador."
    status: nao_implementado
  - id: RF006
    descricao: "O título da tarefa é obrigatório."
    status: implementado

requisitos_nao_funcionais:
  - id: RNF001
    descricao: "A API deve usar HTTP e JSON."
  - id: RNF002
    descricao: "A aplicação deve iniciar na porta 8080."
  - id: RNF003
    descricao: "O código deve separar controller, service e model."

casos_de_uso:
  - id: UC001
    nome: "Cadastrar tarefa"
    ator: "Usuário"
    requisito: RF001
    status: implementado
    endpoint: "POST /tarefas"
    entrada:
      titulo: "Estudar Java"
      descricao: "Revisar controllers do Spring"
    resultado_esperado: "Retorna HTTP 201 e a tarefa criada com identificador."
    criterios_aceitacao:
      - "Uma tarefa válida deve ser cadastrada."
      - "O identificador deve ser gerado automaticamente."
      - "A tarefa deve iniciar com concluida = false."
      - "Se o título estiver vazio, a validação deve rejeitar a entrada."

  - id: UC002
    nome: "Listar tarefas"
    ator: "Usuário"
    requisito: RF002
    status: implementado
    endpoint: "GET /tarefas"
    resultado_esperado: "Retorna HTTP 200 e uma lista de tarefas; se não houver tarefas, retorna lista vazia."
    criterios_aceitacao:
      - "A resposta deve ser um array JSON."
      - "A lista deve conter as tarefas cadastradas durante a execução atual."

  - id: UC003
    nome: "Consultar tarefa por ID"
    ator: "Usuário"
    requisito: RF003
    status: nao_implementado
    endpoint_planejado: "GET /tarefas/{id}"
    resultado_esperado: "Retorna a tarefa encontrada ou HTTP 404 se não existir."
    criterios_aceitacao:
      - "Uma tarefa existente deve ser retornada."
      - "Um ID inexistente deve resultar em HTTP 404."

  - id: UC004
    nome: "Atualizar tarefa"
    ator: "Usuário"
    requisito: RF004
    status: nao_implementado
    endpoint_planejado: "PUT /tarefas/{id}"
    resultado_esperado: "Atualiza os dados permitidos e retorna a tarefa atualizada."
    criterios_aceitacao:
      - "A tarefa deve existir para ser atualizada."
      - "O título não pode ficar vazio."
      - "O estado de conclusão pode ser alterado."

  - id: UC005
    nome: "Excluir tarefa"
    ator: "Usuário"
    requisito: RF005
    status: nao_implementado
    endpoint_planejado: "DELETE /tarefas/{id}"
    resultado_esperado: "Remove a tarefa e retorna HTTP 204; se não existir, retorna HTTP 404."
    criterios_aceitacao:
      - "Uma tarefa existente deve ser removida."
      - "Uma tarefa removida não deve aparecer na listagem."

tarefas_desenvolvimento:
  - id: T001
    descricao: "Criar estrutura inicial Spring Boot."
    relacionado_a: []
    status: concluida
  - id: T002
    descricao: "Implementar cadastro de tarefas."
    relacionado_a: [UC001]
    status: concluida
  - id: T003
    descricao: "Implementar listagem de tarefas."
    relacionado_a: [UC002]
    status: concluida
  - id: T004
    descricao: "Implementar consulta por ID e tratamento de 404."
    relacionado_a: [UC003]
    status: pendente
  - id: T005
    descricao: "Implementar atualização de tarefa."
    relacionado_a: [UC004]
    status: pendente
  - id: T006
    descricao: "Implementar exclusão de tarefa."
    relacionado_a: [UC005]
    status: pendente
